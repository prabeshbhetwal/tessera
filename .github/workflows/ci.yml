name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Core unit tests
        run: swift test --package-path Packages/TesseraCore
      - name: Build app
        run: scripts/build-app.sh
