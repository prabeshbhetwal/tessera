name: Tessera
options:
  bundleIdPrefix: com.prabeshbhetwal
  deploymentTarget:
    macOS: "15.0"
packages:
  TesseraCore:
    path: Packages/TesseraCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
targets:
  Tessera:
    type: application
    platform: macOS
    sources: [Tessera]
    dependencies:
      - package: TesseraCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prabeshbhetwal.Tessera
        PRODUCT_NAME: Tessera
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    postBuildScripts:
      # The tessera CLI (TesseraCLI package target), embedded at Contents/Helpers/tessera.
      # Not Contents/MacOS/tessera: on case-insensitive APFS that is the app's own MacOS/Tessera.
      - name: Embed tessera CLI
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          CONF=$(echo "$CONFIGURATION" | tr '[:upper:]' '[:lower:]')
          [ "$CONF" = "release" ] || CONF=debug
          SCRATCH="$OBJROOT/tessera-cli"
          run_swift() {
            env -i HOME="$HOME" PATH="/usr/bin:/bin:/usr/sbin:/sbin" DEVELOPER_DIR="$DEVELOPER_DIR" \
              xcrun swift build -c "$CONF" --package-path "$SRCROOT/Packages/TesseraCore" \
              --product tessera --scratch-path "$SCRATCH" "$@"
          }
          run_swift
          DEST="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          mkdir -p "$DEST"
          cp -f "$(run_swift --show-bin-path)/tessera" "$DEST/tessera"
          codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" "$DEST/tessera"
    info:
      path: Tessera/Info.plist
      properties:
        CFBundleName: Tessera
        CFBundleDisplayName: Tessera
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        CFBundleIconFile: AppIcon
        CFBundleIconName: AppIcon
        LSUIElement: true
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: "Tessera — inspired by Loop, contains no Loop code."
        NSAppleScriptEnabled: true
        OSAScriptingDefinition: Tessera.sdef
        CFBundleURLTypes:
          - CFBundleURLName: com.prabeshbhetwal.Tessera
            CFBundleURLSchemes: [tessera]
schemes:
  Tessera:
    build:
      targets:
        Tessera: all
    test:
      targets:
        - package: TesseraCore/TesseraCoreTests
