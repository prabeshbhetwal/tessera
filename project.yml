name: Tessera
options:
  bundleIdPrefix: com.prabeshbhetwal
  deploymentTarget:
    macOS: "15.0"
packages:
  TesseraCore:
    path: Packages/TesseraCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
targets:
  Tessera:
    type: application
    platform: macOS
    sources: [Tessera]
    dependencies:
      - package: TesseraCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prabeshbhetwal.Tessera
        PRODUCT_NAME: Tessera
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Tessera/Info.plist
      properties:
        CFBundleName: Tessera
        CFBundleDisplayName: Tessera
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: "Tessera — inspired by Loop, contains no Loop code."
        NSAppleScriptEnabled: true
        OSAScriptingDefinition: Tessera.sdef
        CFBundleURLTypes:
          - CFBundleURLName: com.prabeshbhetwal.Tessera
            CFBundleURLSchemes: [tessera]
schemes:
  Tessera:
    build:
      targets:
        Tessera: all
    test:
      targets:
        - package: TesseraCore/TesseraCoreTests
